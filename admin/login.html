<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Admin — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="icon" type="image/jpeg" href="../images/logo.jpg" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <img src="../images/logo.jpg" alt="SK Seal" />
      <h2>SK Admin Panel</h2>
      <p>Barangay Panicuason · Naga City</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@panicuason.sk" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>

    <div class="login-footer">
      <a href="../index.html">&larr; Back to Website</a>
    </div>
  </div>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/admin-auth.js"></script>

  <script>
    auth.onAuthStateChanged(function (user) {
      if (user) window.location.href = 'index.html';
    });

    var form       = document.getElementById('loginForm');
    var emailInput = document.getElementById('email');
    var passInput  = document.getElementById('password');
    var loginBtn   = document.getElementById('loginBtn');
    var errorDiv   = document.getElementById('loginError');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorDiv.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';
      try {
        await AdminAuth.signIn(emailInput.value.trim(), passInput.value);
        window.location.href = 'index.html';
      } catch (err) {
        var msg = 'Login failed. Please try again.';
        if (err.code === 'auth/user-not-found')  msg = 'No account found with this email.';
        if (err.code === 'auth/wrong-password')   msg = 'Incorrect password.';
        if (err.code === 'auth/invalid-email')    msg = 'Invalid email address.';
        if (err.code === 'auth/too-many-requests') msg = 'Too many attempts. Please wait.';
        errorDiv.textContent = msg;
        errorDiv.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
