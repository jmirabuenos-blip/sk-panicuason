<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Admin — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="icon" type="image/jpeg" href="../images/logo.jpg" />
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <div class="admin-container">
      <header class="admin-header">
        <a href="index.html" class="admin-brand"><img src="../images/logo.jpg" alt="SK" class="brand-logo" /><span class="brand-name">SK Admin</span></a>
        <nav class="admin-nav">
          <a href="index.html" class="nav-pill">Dashboard</a>
          <a href="events.html" class="nav-pill">Events</a>
          <a href="announcements.html" class="nav-pill">Announcements</a>
          <a href="gallery-admin.html" class="nav-pill active">Gallery</a>
          <a href="officials.html" class="nav-pill">Officials</a>
        </nav>
        <div class="admin-header-right">
          <div class="header-avatar" id="userAvatar">A</div>
          <button class="admin-hamburger" id="adminHamburger" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
      </header>
      <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
      <div class="mobile-nav-panel" id="mobileNavPanel">
        <div class="mobile-nav-header"><span>Navigation</span><button class="mobile-nav-close" id="mobileNavClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <nav class="mobile-nav-links"><a href="index.html">Dashboard</a><a href="events.html">Events</a><a href="announcements.html">Announcements</a><a href="gallery-admin.html" class="active">Gallery</a><a href="officials.html">Officials</a></nav>
        <div class="mobile-nav-footer"><span id="userEmail">Admin</span><button class="btn-signout" id="logoutBtn">Sign Out</button></div>
      </div>
      <div class="admin-content">
        <div class="content-header">
          <div><h1>Gallery</h1><p class="content-subtitle">Manage gallery photos</p></div>
          <button class="btn-add" id="btnAddPhoto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Photo</button>
        </div>
        <div class="admin-table-wrap"><div id="galleryTableContainer"><div class="loading-spinner"><div class="spinner"></div></div></div></div>
      </div>
    </div>
  </div>

  <!-- ══ PHOTO MODAL ══ -->
  <div class="modal-overlay" id="photoModal">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Photo</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="photoForm">
          <input type="hidden" id="photoId" />

          <div class="form-group">
            <label for="photoTitle">Title *</label>
            <input type="text" id="photoTitle" placeholder="e.g. SK Basketball Tournament" required />
          </div>

          <div class="form-group">
            <label for="photoCaption">Caption</label>
            <input type="text" id="photoCaption" placeholder="Short description" />
          </div>

          <div class="form-group">
            <label for="photoCategory">Category</label>
            <select id="photoCategory">
              <option value="">— Select —</option>
              <option value="Events">Events</option>
              <option value="Sports">Sports</option>
              <option value="Community">Community</option>
              <option value="Education">Education</option>
              <option value="Livelihood">Livelihood</option>
              <option value="Environment">Environment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="photoImage">Image URL *</label>
            <input type="text" id="photoImage" placeholder="Paste an image URL" required />
            <img id="imagePreview" class="image-preview" alt="Preview" />
          </div>

          <div class="form-group">
            <label for="photoOrder">Display Order</label>
            <input type="number" id="photoOrder" value="0" min="0" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save" id="modalSave">Save Photo</button>
      </div>
    </div>
  </div>

  <!-- ══ CONFIRM DELETE ══ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;">
      <div class="confirm-dialog">
        <div class="confirm-icon">⚠️</div>
        <h4>Delete Photo?</h4>
        <p>This action cannot be undone.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="confirmCancel">Cancel</button>
          <button class="btn-danger" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/admin-gallery.js"></script>
</body>
</html>
