<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Admin — Announcements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="icon" type="image/jpeg" href="../images/logo.jpg" />
</head>
<body class="admin-body">

  <button class="sidebar-toggle" id="sidebarToggle">☰</button>

  <div class="admin-layout">

    <!-- ══ SIDEBAR ══ -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <img src="../images/logo.jpg" alt="SK Seal" />
        <div>
          <span class="sh-top">SK Admin</span>
          <span class="sh-sub">Panicuason</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-nav-label">Management</div>
        <a href="index.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="events.html"><span class="nav-icon">📅</span> Events</a>
        <a href="announcements.html" class="active"><span class="nav-icon">📢</span> Announcements</a>
        <a href="gallery-admin.html"><span class="nav-icon">🖼️</span> Gallery</a>
        <a href="officials.html"><span class="nav-icon">👥</span> Officials</a>
        <div class="sidebar-nav-label">Links</div>
        <a href="../index.html" target="_blank"><span class="nav-icon">🌐</span> View Website</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">A</div>
          <div class="user-email" id="userEmail">Loading…</div>
        </div>
        <button class="btn-logout" id="logoutBtn">Sign Out</button>
      </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Announcements</h1>
          <span class="breadcrumb"><a href="../index.html">Home</a> / Admin / Announcements</span>
        </div>
        <button class="btn-add" id="btnAddAnnouncement">+ Add Announcement</button>
      </div>

      <div class="admin-table-wrap">
        <div id="announcementsTableContainer">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ══ ANNOUNCEMENT MODAL ══ -->
  <div class="modal-overlay" id="announcementModal">
    <div class="modal" style="max-width:640px;">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Announcement</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="announcementForm">
          <input type="hidden" id="announcementId" />

          <div class="form-group">
            <label for="annTitle">Title *</label>
            <input type="text" id="annTitle" placeholder="e.g. Educational Assistance Alert!" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="annTag">Tag / Category</label>
              <input type="text" id="annTag" placeholder="e.g. Scholarships, Livelihood" />
            </div>
            <div class="form-group">
              <label for="annTagColor">Tag Color</label>
              <input type="color" id="annTagColor" value="#0d6efd" style="height:38px;padding:4px;cursor:pointer;" />
            </div>
          </div>

          <div class="form-group">
            <label for="annContent">Content / Description</label>
            <textarea id="annContent" placeholder="Write the announcement details. HTML is supported for bold, lists, links, etc." style="min-height:140px;"></textarea>
          </div>

          <div class="form-group">
            <label for="annImage">Image URL</label>
            <input type="text" id="annImage" placeholder="Paste an image URL (e.g. from Facebook, Google Drive)" />
            <input type="file" id="annImageFile" accept="image/*" style="display:none;" />
            <img id="imagePreview" class="image-preview" alt="Preview" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="annLinkUrl">Link URL (optional)</label>
              <input type="url" id="annLinkUrl" placeholder="https://docs.google.com/forms/…" />
            </div>
            <div class="form-group">
              <label for="annLinkText">Link Button Text</label>
              <input type="text" id="annLinkText" placeholder="e.g. Click here to apply" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="annOrder">Display Order</label>
              <input type="number" id="annOrder" value="0" min="0" />
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.82rem;">
                <input type="checkbox" id="annActive" checked style="width:18px;height:18px;" />
                Active (visible on website)
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save" id="modalSave">Save Announcement</button>
      </div>
    </div>
  </div>

  <!-- ══ CONFIRM DELETE ══ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;">
      <div class="confirm-dialog">
        <div class="confirm-icon">⚠️</div>
        <h4>Delete Announcement?</h4>
        <p>This action cannot be undone. The announcement will be permanently removed.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="confirmCancel">Cancel</button>
          <button class="btn-danger" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-announcements.js"></script>
</body>
</html>
