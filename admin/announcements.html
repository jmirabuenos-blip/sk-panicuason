<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Admin — Announcements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="icon" type="image/jpeg" href="../images/logo.jpg" />
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <div class="admin-container">
      <header class="admin-header">
        <a href="index.html" class="admin-brand"><img src="../images/logo.jpg" alt="SK" class="brand-logo" /><span class="brand-name">SK Admin</span></a>
        <nav class="admin-nav">
          <a href="index.html" class="nav-pill">Dashboard</a>
          <a href="events.html" class="nav-pill">Events</a>
          <a href="announcements.html" class="nav-pill active">Announcements</a>
          <a href="gallery-admin.html" class="nav-pill">Gallery</a>
          <a href="officials.html" class="nav-pill">Officials</a>
        </nav>
        <div class="admin-header-right">
          <div class="header-avatar" id="userAvatar">A</div>
          <button class="admin-hamburger" id="adminHamburger" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
      </header>
      <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
      <div class="mobile-nav-panel" id="mobileNavPanel">
        <div class="mobile-nav-header"><span>Navigation</span><button class="mobile-nav-close" id="mobileNavClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <nav class="mobile-nav-links"><a href="index.html">Dashboard</a><a href="events.html">Events</a><a href="announcements.html" class="active">Announcements</a><a href="gallery-admin.html">Gallery</a><a href="officials.html">Officials</a></nav>
        <div class="mobile-nav-footer"><span id="userEmail">Admin</span><button class="btn-signout" id="logoutBtn">Sign Out</button></div>
      </div>
      <div class="admin-content">
        <div class="content-header">
          <div><h1>Announcements</h1><p class="content-subtitle">Manage community notices and alerts</p></div>
          <button class="btn-add" id="btnAddAnnouncement"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Announcement</button>
        </div>
        <div class="admin-table-wrap"><div id="announcementsTableContainer"><div class="loading-spinner"><div class="spinner"></div></div></div></div>
      </div>
    </div>
  </div>

  <!-- ══ ANNOUNCEMENT MODAL ══ -->
  <div class="modal-overlay" id="announcementModal">
    <div class="modal" style="max-width:640px;">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Announcement</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="announcementForm">
          <input type="hidden" id="announcementId" />

          <div class="form-group">
            <label for="annTitle">Title *</label>
            <input type="text" id="annTitle" placeholder="e.g. Educational Assistance Alert!" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="annTag">Tag / Category</label>
              <input type="text" id="annTag" placeholder="e.g. Scholarships, Livelihood" />
            </div>
            <div class="form-group">
              <label for="annTagColor">Tag Color</label>
              <input type="color" id="annTagColor" value="#0d6efd" style="height:38px;padding:4px;cursor:pointer;" />
            </div>
          </div>

          <div class="form-group">
            <label for="annContent">Content / Description</label>
            <textarea id="annContent" placeholder="Write the announcement details. HTML is supported for bold, lists, links, etc." style="min-height:140px;"></textarea>
          </div>

          <div class="form-group">
            <label for="annImage">Image URL</label>
            <input type="text" id="annImage" placeholder="Paste an image URL (e.g. from Facebook, Google Drive)" />
            <input type="file" id="annImageFile" accept="image/*" style="display:none;" />
            <img id="imagePreview" class="image-preview" alt="Preview" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="annLinkUrl">Link URL (optional)</label>
              <input type="url" id="annLinkUrl" placeholder="https://docs.google.com/forms/…" />
            </div>
            <div class="form-group">
              <label for="annLinkText">Link Button Text</label>
              <input type="text" id="annLinkText" placeholder="e.g. Click here to apply" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="annOrder">Display Order</label>
              <input type="number" id="annOrder" value="0" min="0" />
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.82rem;">
                <input type="checkbox" id="annActive" checked style="width:18px;height:18px;" />
                Active (visible on website)
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save" id="modalSave">Save Announcement</button>
      </div>
    </div>
  </div>

  <!-- ══ CONFIRM DELETE ══ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;">
      <div class="confirm-dialog">
        <div class="confirm-icon">⚠️</div>
        <h4>Delete Announcement?</h4>
        <p>This action cannot be undone. The announcement will be permanently removed.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="confirmCancel">Cancel</button>
          <button class="btn-danger" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/admin-announcements.js"></script>
</body>
</html>
