<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Admin — Officials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="icon" type="image/jpeg" href="../images/logo.jpg" />
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <div class="admin-container">
      <header class="admin-header">
        <a href="index.html" class="admin-brand"><img src="../images/logo.jpg" alt="SK" class="brand-logo" /><span class="brand-name">SK Admin</span></a>
        <nav class="admin-nav">
          <a href="index.html" class="nav-pill">Dashboard</a>
          <a href="events.html" class="nav-pill">Events</a>
          <a href="announcements.html" class="nav-pill">Announcements</a>
          <a href="gallery-admin.html" class="nav-pill">Gallery</a>
          <a href="officials.html" class="nav-pill active">Officials</a>
        </nav>
        <div class="admin-header-right">
          <div class="header-avatar" id="userAvatar">A</div>
          <button class="admin-hamburger" id="adminHamburger" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
      </header>
      <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
      <div class="mobile-nav-panel" id="mobileNavPanel">
        <div class="mobile-nav-header"><span>Navigation</span><button class="mobile-nav-close" id="mobileNavClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <nav class="mobile-nav-links"><a href="index.html">Dashboard</a><a href="events.html">Events</a><a href="announcements.html">Announcements</a><a href="gallery-admin.html">Gallery</a><a href="officials.html" class="active">Officials</a></nav>
        <div class="mobile-nav-footer"><span id="userEmail">Admin</span><button class="btn-signout" id="logoutBtn">Sign Out</button></div>
      </div>
      <div class="admin-content">
        <div class="content-header">
          <div><h1>Officials</h1><p class="content-subtitle">Manage SK council members</p></div>
          <button class="btn-add" id="btnAddOfficial"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Official</button>
        </div>
        <div class="admin-table-wrap"><div id="officialsTableContainer"><div class="loading-spinner"><div class="spinner"></div></div></div></div>
      </div>
    </div>
  </div>

  <!-- ══ OFFICIAL MODAL ══ -->
  <div class="modal-overlay" id="officialModal">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Official</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="officialForm">
          <input type="hidden" id="officialId" />

          <div class="form-group">
            <label for="officialName">Full Name *</label>
            <input type="text" id="officialName" placeholder="e.g. Juan Dela Cruz" required />
          </div>

          <div class="form-group">
            <label for="officialPosition">Position</label>
            <input type="text" id="officialPosition" placeholder="e.g. SK Kagawad, SK Secretary" />
          </div>

          <div class="form-group">
            <label for="officialImage">Photo URL</label>
            <input type="text" id="officialImage" placeholder="Paste a photo URL" />
            <img id="imagePreview" class="image-preview" alt="Preview" style="max-height:150px;border-radius:50%;width:auto;" />
          </div>

          <div class="form-group">
            <label for="officialBio">Bio / Description</label>
            <textarea id="officialBio" placeholder="Short bio about this official…" style="min-height:80px;"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="officialOrder">Display Order</label>
              <input type="number" id="officialOrder" value="0" min="0" />
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.82rem;">
                <input type="checkbox" id="officialChairman" style="width:18px;height:18px;" />
                SK Chairman (featured layout)
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save" id="modalSave">Save Official</button>
      </div>
    </div>
  </div>

  <!-- ══ CONFIRM DELETE ══ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;">
      <div class="confirm-dialog">
        <div class="confirm-icon">⚠️</div>
        <h4>Remove Official?</h4>
        <p>This action cannot be undone.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="confirmCancel">Cancel</button>
          <button class="btn-danger" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/admin-officials.js"></script>
</body>
</html>
